<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할머니, 김치 어떻게 담가요?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#2b2420;font-family:'Gowun Dodum',sans-serif;color:#3a2a1e;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#efe2cc;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#gl{position:absolute;inset:0;width:1280px;height:720px;display:block}
.screen{position:absolute;inset:0;display:none;pointer-events:none}
.screen.on{display:block}
.screen>*{pointer-events:auto}
.jua{font-family:'Do Hyeon',sans-serif}
button{font-family:'Do Hyeon',sans-serif;cursor:pointer;border:none}
.btn{background:#d9482f;color:#fff;font-size:24px;padding:12px 30px;border-radius:40px;box-shadow:0 5px 0 #8f2a19;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f2a19}
.btn.sub{background:#fff7ea;color:#7a4a2a;box-shadow:0 5px 0 #c9a77f}
.btn:disabled{background:#bba89a;box-shadow:0 5px 0 #8d7d70;cursor:not-allowed}
#steps{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:none;gap:4px;z-index:30;background:rgba(255,248,236,.92);padding:6px 8px;border-radius:30px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
#steps.on{display:flex}
#steps span{font-family:'Do Hyeon';font-size:15px;padding:5px 11px;border-radius:20px;color:#a08a76;white-space:nowrap}
#steps span.cur{background:#d9482f;color:#fff}
#steps span.done{color:#5b8a3a}
/* title */
#title h1{position:absolute;left:70px;top:150px;font-family:'Do Hyeon';font-size:68px;color:#fff8ea;line-height:1.15;text-shadow:0 4px 0 #8f2a19,0 8px 24px rgba(0,0,0,.35);pointer-events:none}
#title h1 small{display:block;font-size:26px;color:#ffe2b8;text-shadow:0 2px 6px rgba(0,0,0,.5);margin-bottom:10px}
#title .menu{position:absolute;left:70px;top:410px;display:flex;gap:16px}
/* dialogue */
.dlg{position:absolute;left:60px;right:60px;bottom:30px;background:rgba(255,250,240,.96);border-radius:20px;padding:26px 34px 30px;box-shadow:0 8px 24px rgba(0,0,0,.3);border:3px solid #e2b98a;min-height:124px;cursor:pointer}
.dlg .who{position:absolute;top:-20px;left:28px;background:#d9482f;color:#fff;font-family:'Do Hyeon';font-size:20px;padding:4px 18px;border-radius:20px}
.dlg .who.g{background:#3f6b4a}
.dlg p{font-size:24px;line-height:1.55}
.dlg .next{position:absolute;right:22px;bottom:12px;font-size:15px;color:#b08a66}
/* bubbles */
.bubble{position:absolute;background:#fff;border-radius:18px;padding:12px 18px;font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.18);line-height:1.45}
.bubble:after{content:'';position:absolute;border:12px solid transparent}
.bubble.b:after{left:50%;margin-left:-12px;bottom:-22px;border-top-color:#fff}
.bubble.l:after{left:-20px;top:20px;border-right-color:#fff}
.headBubble{transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.panel{position:absolute;background:rgba(255,250,242,.95);border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:16px 18px}
/* select */
#ingPanel{right:20px;top:66px;width:560px;height:574px;overflow:hidden}
#ingPanel h3{font-family:'Do Hyeon';font-size:20px;margin:2px 0 8px;color:#7a3b1f}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.card{background:#fff;border-radius:14px;border:3px solid #f0dfc8;padding:4px 3px 6px;text-align:center;cursor:pointer;position:relative;transition:transform .1s}
.card:hover{transform:translateY(-3px)}
.card img{width:84px;height:70px;object-fit:contain;display:block;margin:0 auto}
.card b{font-family:'Do Hyeon';font-weight:normal;font-size:16px;display:block}
.card i{font-style:normal;font-size:11px;color:#9a8270}
.card.on{border-color:#d9482f;background:#fff1ec}
.card.on:after{content:'✔';position:absolute;top:4px;right:6px;background:#d9482f;color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:22px}
.card.weird{border-style:dashed}
.hint{font-size:14px;color:#a08a76}
.selBar{position:absolute;right:20px;bottom:18px;width:560px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,250,242,.95);border-radius:20px;padding:10px 12px 10px 18px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.selBar .cnt{font-family:'Do Hyeon';font-size:20px;color:#7a3b1f}
.bottomR{position:absolute;right:30px;bottom:24px}
/* call window (grandma / player live 3d inset) */
.callwin{position:absolute;border:5px solid #fff;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none!important;display:none}
.callwin.on{display:block}
.callwin .nm{position:absolute;left:8px;bottom:8px;background:rgba(40,120,70,.92);color:#fff;font-family:'Do Hyeon';font-size:14px;padding:2px 10px;border-radius:10px}
.callwin .nm:before{content:'● ';color:#ff6b5b}
.coachB{position:absolute;left:262px;bottom:96px;max-width:400px;pointer-events:none!important}
.coachB:after{left:-20px;bottom:18px;border-right-color:#fff}
/* 1st-person HUD */
.methods{position:absolute;bottom:18px;left:50%;transform:translateX(-30%);display:flex;gap:8px;background:rgba(255,250,242,.94);padding:8px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.methods button{background:#fff;border:3px solid #f0dfc8;border-radius:16px;padding:6px 12px;font-size:18px;color:#5a3a22;min-width:92px}
.methods button small{display:block;font-family:'Gowun Dodum';font-size:12px;color:#a08a76}
.methods button.on{border-color:#d9482f;background:#fff1ec}
.methods button:disabled{opacity:.45;cursor:not-allowed}
.queue{position:absolute;top:70px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.queue .q{background:rgba(255,255,255,.9);border-radius:14px;padding:3px 8px 3px 3px;display:flex;align-items:center;gap:3px;font-size:14px;border:2px solid transparent}
.queue .q img{width:34px;height:30px;object-fit:contain}
.queue .q.cur{border-color:#d9482f}
.queue .q.done{opacity:.5}
.tip{position:absolute;top:116px;left:50%;transform:translateX(-50%);background:rgba(58,42,30,.82);color:#fff;font-size:18px;padding:8px 18px;border-radius:20px;white-space:nowrap;pointer-events:none!important}
.lbl{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.92);border-radius:10px;padding:2px 8px;font-size:13px;font-family:'Do Hyeon';white-space:nowrap;pointer-events:none!important;color:#5a3a22}
.lbl em{font-style:normal;color:#d9482f;margin-left:3px}
.lbl.weird{background:#fbe8ff}
.lbl.on{background:#d9482f;color:#fff}
.sideBtns{position:absolute;right:20px;top:110px;display:flex;flex-direction:column;gap:10px}
.progress{position:absolute;top:110px;left:50%;transform:translateX(-50%);width:420px;height:22px;background:rgba(255,255,255,.85);border-radius:12px;overflow:hidden;border:2px solid #fff}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#e8673f,#c8281e);transition:width .1s}
/* store */
#store h2{position:absolute;left:36px;bottom:34px;font-family:'Do Hyeon';font-size:30px;color:#fff;text-shadow:0 3px 0 #8f2a19,0 4px 14px rgba(0,0,0,.4);pointer-events:none}
/* eval */
#gBubble{left:40px;top:80px;width:400px;min-height:110px;font-size:21px}
#gBubble:after{right:-22px;left:auto;top:40px;border-left-color:#fff}
#gBubble .line{margin:4px 0;opacity:0;transform:translateY(6px);transition:all .35s}
#gBubble .line.show{opacity:1;transform:none}
#resCard{right:26px;top:66px;width:390px;opacity:0;transform:translateX(40px);transition:all .5s}
#resCard.show{opacity:1;transform:none}
#resCard .kname{font-family:'Do Hyeon';font-size:28px;color:#7a2a14;margin:4px 0 4px;line-height:1.2;text-align:center}
#resCard .new{display:inline-block;background:#ffcf3f;color:#6a3a00;font-family:'Do Hyeon';padding:3px 12px;border-radius:12px;font-size:15px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.thumbs{font-size:26px;letter-spacing:2px;text-align:center}
.thumbs .off{filter:grayscale(1);opacity:.3}
.bars{margin-top:6px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.bar label{width:58px;font-family:'Do Hyeon'}
.bar .t{flex:1;height:14px;background:#efe3d3;border-radius:8px;overflow:hidden}
.bar .t div{height:100%;border-radius:8px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar .v{width:26px;text-align:right;font-family:'Do Hyeon';color:#8a7260}
#resCard .detail{font-size:13px;color:#8a7260;margin-top:6px;text-align:center}
#resCard h4{font-family:'Do Hyeon';font-weight:normal;font-size:17px;color:#7a3b1f;margin-top:8px}
#eval .btns{position:absolute;right:26px;bottom:22px;display:flex;gap:12px;opacity:0;transition:opacity .4s;pointer-events:none!important;visibility:hidden}
#eval .btns.show{opacity:1;pointer-events:auto!important;visibility:visible}
#btnDexFloat{position:absolute;right:18px;top:14px;z-index:40;font-size:18px;padding:8px 16px}
#btnHome{position:absolute;left:20px;top:70px;font-size:18px;padding:8px 18px}
.dcard .taste{display:block;font-size:13px;color:#7a5a3a;margin-top:4px;line-height:1.35}
/* dex */
#dex{background:rgba(30,20,12,.72);z-index:50}
#dex .box{position:absolute;left:90px;right:90px;top:50px;bottom:50px;background:#fff8ec;border-radius:24px;padding:24px 30px;overflow:auto}
#dex h2{font-family:'Do Hyeon';font-size:32px;color:#7a3b1f}
#dex .cnt{font-size:16px;color:#a08a76;margin-bottom:14px}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dcard{background:#fff;border-radius:16px;border:3px solid #f0dfc8;padding:10px;min-height:150px;text-align:center}
.dcard img{width:100%;height:96px;object-fit:cover;border-radius:10px;background:#eee}
.dcard .q{height:96px;display:flex;align-items:center;justify-content:center;font-family:'Do Hyeon';font-size:48px;color:#d8c6b2;background:#f6efe5;border-radius:10px}
.dcard b{font-family:'Do Hyeon';font-weight:normal;font-size:18px;display:block;margin-top:6px}
.dcard span{font-size:13px;color:#a08a76}
.dcard.lock b{color:#b9a796}
#dex .close{position:absolute;right:26px;top:22px}
#toast{position:absolute;top:150px;left:50%;transform:translateX(-50%) scale(.8);background:#ffcf3f;color:#5a3000;font-family:'Do Hyeon';font-size:24px;padding:10px 26px;border-radius:30px;opacity:0;transition:all .3s;z-index:60;pointer-events:none;box-shadow:0 5px 16px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Do Hyeon';font-size:28px;color:#7a3b1f;background:#efe2cc;z-index:99}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="gl"></canvas>
  <div id="steps"></div>
  <button class="btn sub" id="btnDexFloat">📖 김치 도감</button>
  <div class="callwin" id="callwin"><div class="nm" id="callName">할머니</div></div>

  <div class="screen" id="title">
    <h1><small>해외 자취생의 김장 도전기</small>할머니,<br>김치 어떻게 담가요?</h1>
    <div class="menu"><button class="btn" id="btnStart">김장 시작하기</button></div>
  </div>

  <div class="screen" id="intro">
    <div class="bubble b headBubble" id="introHead" style="display:none"></div>
    <div class="dlg" id="introDlg"><div class="who" id="introWho">나</div><p id="introText"></p><div class="next">클릭해서 계속 ▶</div></div>
  </div>

  <div class="screen" id="select">
    <button class="btn sub" id="btnHome">◀ 처음으로</button>
    <div class="bubble b headBubble" id="selBubble">오늘은 뭘 넣어볼까?</div>
    <div class="panel" id="ingPanel">
      <h3>🥬 기본 김장 재료</h3><div class="grid" id="gridBasic"></div>
      <h3>✨ 엉뚱한 재료</h3><div class="grid" id="gridWeird"></div>
      <div class="hint">누르면 하늘에서 대야로 떨어지고, 한 번 더 누르면 빠져요.</div>
    </div>
    <div class="selBar"><span class="cnt" id="bCount">대야 0 / 6</span><button class="btn" id="btnToCut" disabled>손질하러 가기 ▶</button></div>
  </div>

  <div class="screen" id="cut">
    <button class="btn sub" id="btnCutBack" style="position:absolute;left:20px;top:70px;font-size:18px;padding:8px 18px">◀ 재료 다시 고르기</button>
    <div class="queue" id="cutQueue"></div>
    <div class="tip" id="cutTip"></div>
    <div class="bubble l coachB" id="cutCoach"></div>
    <div class="methods" id="methods"></div>
  </div>

  <div class="screen" id="season">
    <div id="seasonLbls"></div>
    <div class="tip" id="seasonTip">통을 클릭하면 한 숟갈씩 들어가요!</div>
    <div class="bubble l coachB" id="seasonCoach"></div>
    <div class="sideBtns"><button class="btn sub" style="font-size:18px;padding:9px 18px" id="btnSeasonReset">그릇 비우기</button><button class="btn" style="font-size:18px;padding:9px 18px" id="btnStir">양념 섞기</button></div>
    <div class="bottomR"><button class="btn" id="btnToMix" disabled>버무리러 가기 ▶</button></div>
  </div>

  <div class="screen" id="mix">
    <div class="progress"><div id="mixBar"></div></div>
    <div class="tip" id="mixTip" style="top:144px">마우스를 누른 채로 빙글빙글 버무려요!</div>
    <div class="bubble l coachB" id="mixCoach"></div>
    <div class="bottomR"><button class="btn" id="btnToStore" disabled>다 버무렸다! ▶</button></div>
  </div>

  <div class="screen" id="store">
    <h2>김치를 어디에 담을까? 클릭해서 골라요</h2>
    <div class="bubble b headBubble" id="storeBubble">어떻게 먹을지 정하자!</div>
    <div id="storeLbls"></div>
    <div class="bottomR"><button class="btn" id="btnToEval" disabled>할머니께 보여드리기 ▶</button></div>
  </div>

  <div class="screen" id="eval">
    <div class="bubble" id="gBubble"></div>
    <div class="panel" id="resCard">
      <div style="text-align:center" id="resNew"></div>
      <div class="kname" id="resName"></div>
      <div class="thumbs" id="resThumbs"></div>
      <h4>👅 할머니의 맛 분석</h4>
      <div class="bars" id="resBars"></div>
      <div class="detail" id="resDetail"></div>
    </div>
    <div class="btns" id="evalBtns"><button class="btn" id="btnAgain">다시 만들기</button></div>
  </div>

  <div class="screen" id="dex"><div class="box">
    <button class="btn sub close" id="btnDexClose">닫기 ✕</button>
    <h2>📖 김치 도감</h2><div class="cnt" id="dexCnt"></div>
    <div class="dgrid" id="dexGrid"></div>
    <h2 style="font-size:24px;margin-top:20px">최근에 만든 김치</h2>
    <div class="dgrid" id="dexRecent" style="margin-top:10px"></div>
  </div></div>

  <div id="toast"></div>
  <div id="loading">김장 준비 중…</div>
</div></div>
